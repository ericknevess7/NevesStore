{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meu Perfil — Neves Store</title>
  <link rel="stylesheet" href="{% static 'css/nevesStore.css' %}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="logo">
        <a href="index.html"><img src="{% static 'imgs tenis/logoneves store.jpg' %}" alt="Neves Store"></a>
      </div>
      <div class="header-icons">
        <a href="carrinho.html" id="cart-button">
          <i class="fa-solid fa-bag-shopping"></i>
          <span id="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <main style="max-width: 900px; margin: 40px auto; padding: 20px;">
    <!-- Dados do Usuário -->
    <section class="profile-card" style="background: #111; padding: 25px; border-radius: 12px; border: 1px solid #222; color: #fff;">
      <h2 style="color: var(--accent-cyan); margin-bottom: 20px;"><i class="fa-solid fa-user-gear"></i> Meus Dados Cadastrais</h2>
      
      <form id="form-perfil" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Nome:</label>
          <input type="text" id="perfil-nome" class="input-field" style="width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px;">
        </div>
        <div>
          <label>E-mail (não alterável):</label>
          <input type="email" id="perfil-email" class="input-field" disabled style="width: 100%; padding: 10px; background: #181818; border: 1px solid #333; color: #888; border-radius: 6px;">
        </div>
        <div>
          <label>Telefone / WhatsApp:</label>
          <input type="text" id="perfil-telefone" class="input-field" style="width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px;">
        </div>
        <div>
          <label>CEP:</label>
          <input type="text" id="perfil-cep" class="input-field" style="width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px;">
        </div>
        <div style="grid-column: span 2;">
          <label>Endereço de Entrega:</label>
          <input type="text" id="perfil-rua" class="input-field" style="width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px;">
        </div>
        <div style="grid-column: span 2; text-align: right; margin-top: 10px;">
          <button type="submit" style="background: var(--accent-cyan); color: #000; font-weight: bold; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer;">Guardar Alterações</button>
          <button type="button" id="btn-logout" style="background: #dc3545; color: #fff; font-weight: bold; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; margin-left: 10px;">Sair da Conta</button>
        </div>
      </form>
    </section>

    <!-- Secção Minhas Compras -->
    <section class="minhas-compras-section" style="margin-top: 40px; background: #111; padding: 25px; border-radius: 12px; border: 1px solid #222; color: #fff;">
      <h2 style="color: var(--accent-cyan); margin-bottom: 20px;"><i class="fa-solid fa-box-open"></i> Minhas Compras & Pedidos</h2>
      
      <div id="historico-pedidos">
        <p id="sem-pedidos" style="color: #888; text-align: center; padding: 20px;">Ainda não realizaste nenhuma compra na Neves Store.</p>
      </div>
    </section>
  </main>

  <script src="{% static 'js/perfil.js' %}"></script>
</body>
</html>
