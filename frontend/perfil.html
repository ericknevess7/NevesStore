<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minha Conta — Neves Store</title>
  <link rel="stylesheet" href="assets/css/nevesStore.css" />
  <link rel="stylesheet" href="assets/css/perfil.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

  <!-- Header Simplificado -->
  <header class="header">
    <div class="header-container" style="justify-content: space-between;">
      <div class="logo">
        <a href="index.html"><img src="assets/imgs tenis/logoneves store.jpg" alt="Neves Store"></a>
      </div>

      <div class="header-icons">
        <a href="index.html" title="Voltar à Loja" style="font-size: 14px; font-weight: 700; color: var(--text-main);">
          <i class="fa-solid fa-store"></i> Voltar à Loja
        </a>
        <button id="theme-toggle" class="theme-toggle-btn" title="Alternar Modo Claro/Escuro">
          <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Container do Perfil -->
  <main class="perfil-container">
    <div class="perfil-card">
      <div class="perfil-avatar-section">
        <div class="avatar-circle">
          <i class="fa-solid fa-user"></i>
        </div>
        <h2 id="display-nome">Carregando...</h2>
        <span id="display-email" class="badge-email">carregando...</span>
      </div>

      <div class="perfil-form-section">
        <h3><i class="fa-solid fa-user-gear"></i> Meus Dados Cadastrados</h3>
        
        <form id="perfil-form">
          <div class="form-grid">
            <div class="input-box">
              <label><i class="fa-solid fa-font"></i> Nome</label>
              <input type="text" id="nome" required />
            </div>

            <div class="input-box">
              <label><i class="fa-solid fa-envelope"></i> E-mail (Não editável)</label>
              <input type="email" id="email" readonly disabled />
            </div>

            <div class="input-box">
              <label><i class="fa-solid fa-phone"></i> Telefone / WhatsApp</label>
              <input type="tel" id="telefone" placeholder="(19) 99999-9999" />
            </div>

            <div class="input-box">
              <label><i class="fa-solid fa-map-pin"></i> CEP (Busca Automática)</label>
              <input type="text" id="cep" placeholder="00000-000" maxlength="9" />
            </div>

            <div class="input-box" style="grid-column: span 2;">
              <label><i class="fa-solid fa-road"></i> Rua / Avenida</label>
              <input type="text" id="rua" placeholder="Nome da rua" />
            </div>

            <div class="input-box">
              <label><i class="fa-solid fa-hashtag"></i> Número</label>
              <input type="text" id="numero" placeholder="Nº da casa/apto" />
            </div>

            <div class="input-box">
              <label><i class="fa-solid fa-building"></i> Bairro</label>
              <input type="text" id="bairro" placeholder="Bairro" />
            </div>

            <div class="input-box">
              <label><i class="fa-solid fa-city"></i> Cidade</label>
              <input type="text" id="cidade" placeholder="Cidade" />
            </div>

            <div class="input-box">
              <label><i class="fa-solid fa-flag"></i> Estado (UF)</label>
              <input type="text" id="estado" placeholder="UF" maxlength="2" />
            </div>
          </div>

          <div class="actions-group">
            <button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> Salvar Alterações</button>
            <button type="button" id="btn-logout" class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Sair da Conta</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="assets/js/perfil.js"></script>
  <script>
    // Alternar Tema Claro/Escuro
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    if (themeToggleBtn && themeIcon) {
      if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-theme');
        themeIcon.classList.replace('fa-moon', 'fa-sun');
      }

      themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-theme');
        if (document.body.classList.contains('light-theme')) {
          themeIcon.classList.replace('fa-moon', 'fa-sun');
          localStorage.setItem('theme', 'light');
        } else {
          themeIcon.classList.replace('fa-sun', 'fa-moon');
          localStorage.setItem('theme', 'dark');
        }
      });
    }
  </script>
</body>
</html>
